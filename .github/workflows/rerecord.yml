# Records on Windows what a cloud session cannot (it runs no tests or simulations: Linux maths
# differs in the last bit): golden and both balance references, after a deliberate change of
# behaviour. Runs by hand (Actions → Re-record) or on a push one of whose commit messages holds
# «[re-record]» on a line of its own (a sentence that merely names it asks for nothing). It prints
# which seeds of the player's world take the whole food chain in (for the energy test and golden's
# case I), records golden and the references, runs every test and the balance against them, and
# only then commits them to the branch in a commit of their own.
name: Re-record

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: rerecord-${{ github.ref }}

jobs:
  # Whether a record was asked for: «[re-record]» alone on a line of a pushed commit's message. A
  # message that only mentions the marker in passing («[re-record]» in any pushed commit starts it)
  # set off an hour's record the user had not asked for.
  asked:
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(join(github.event.commits.*.message, ' '), '[re-record]')
    runs-on: ubuntu-latest
    outputs:
      record: ${{ steps.check.outputs.record }}
    steps:
      - id: check
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          MESSAGES: ${{ toJSON(github.event.commits.*.message) }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] \
            || printf '%s' "$MESSAGES" | jq -r '.[]' | tr -d '\r' | grep -qxF '[re-record]'; then
            echo "record=true" >> "$GITHUB_OUTPUT"
          fi

  rerecord:
    needs: asked
    if: needs.asked.outputs.record == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The food chain by seed
        run: cargo test -p life-core --test engine -- --ignored --nocapture the_chain_by_seed
      - name: Golden
        run: cargo test -p life-core --test golden -- --nocapture
        env:
          GOLDEN_RECORD: "1"
      - name: The reference
        run: cargo run -p life-report --release -- --save-reference reference/fingerprint.json
      - name: The calm reference
        run: >-
          cargo run -p life-report --release --
          --save-reference reference/calm-fingerprint.json --rule cost_scale=3
      # what CI checks, against what was just recorded
      - name: Every test
        run: cargo test --workspace --no-fail-fast
      - name: Balance vs the new references
        run: |
          cargo run -p life-report --release -- --compare reference/fingerprint.json
          cargo run -p life-report --release -- --compare reference/calm-fingerprint.json --rule cost_scale=3
      - name: Commit
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/life-core/tests/golden.rs reference/
          if git diff --cached --quiet; then
            echo "golden and the references are as recorded: nothing to commit"
            exit 0
          fi
          git commit -m "Re-record golden and the references on Windows" \
            -m "Recorded by the Re-record workflow from $GITHUB_SHA."
          # what the cargo steps left in the tree (a refreshed Cargo.lock) would stop the rebase
          git reset --hard --quiet
          # The run is long and the branch may move meanwhile. Only docs may have come: a record
          # taken from $GITHUB_SHA's code would be wrong on other code, so then the job fails and
          # the record is taken again from the new head (a run of its own).
          for attempt in 1 2 3; do
            git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            if ! git diff --quiet "$GITHUB_SHA" "origin/$BRANCH" -- . ':(exclude)*.md'; then
              echo "::error::$BRANCH moved on with code since $GITHUB_SHA: this record is stale, run Re-record again"
              exit 1
            fi
            git rebase --onto "origin/$BRANCH" HEAD~1 || { git rebase --abort || true; exit 1; }
            git push origin "HEAD:refs/heads/$BRANCH" && exit 0
            sleep 10
          done
          exit 1
