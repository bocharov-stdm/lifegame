# Проверки на каждый push и PR: Rust на Windows и Linux плюс сверка баланса
# с эталоном, снятым с Python-версии (тег python-final).
name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Сверка с эталоном Python
        run: cargo run -p life-report --release -- --compare reference/fingerprint.json
