# Checks on every push and PR: Rust on Windows and Linux (including the game's screen tests),
# plus the balance comparison against the references on Windows only.
name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Тесты экранов игры рисуют через wgpu: на Linux без видеокарты нужен
      # программный Vulkan (lavapipe); на Windows есть встроенный WARP.
      - name: Программный Vulkan и заголовки окна (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libxkbcommon-dev libwayland-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The references are recorded on Windows, where the game runs. Linux takes ln/cos/powf/hypot
      # from its own libm, the last-bit differences grow, and the same seeds become another
      # realization of the world, so its means may leave the Windows per-seed range by chance.
      - name: Balance vs the reference
        if: runner.os == 'Windows'
        run: cargo run -p life-report --release -- --compare reference/fingerprint.json
      - name: Balance vs the calm reference
        if: runner.os == 'Windows'
        run: cargo run -p life-report --release -- --compare reference/calm-fingerprint.json --rule cost_scale=3 --rule cannibalism=1
