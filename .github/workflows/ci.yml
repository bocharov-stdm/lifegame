# Проверки на каждый push и PR: Rust на Windows и Linux (включая тесты экранов
# игры) плюс сверка баланса с эталоном, снятым с Python-версии (тег python-final).
name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Тесты экранов игры рисуют через wgpu: на Linux без видеокарты нужен
      # программный Vulkan (lavapipe); на Windows есть встроенный WARP.
      - name: Программный Vulkan и заголовки окна (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libxkbcommon-dev libwayland-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Сверка с эталоном Python
        run: cargo run -p life-report --release -- --compare reference/fingerprint.json
