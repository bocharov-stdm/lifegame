# Проверки на каждый push и PR: Rust-ядро на Windows и Linux и Python-эталон,
# пока он не удалён (фаза 7 плана перехода).
name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Сверка с эталоном Python
        run: cargo run -p life-report --release -- --compare reference/fingerprint.json

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    env:
      SDL_VIDEODRIVER: dummy
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pygame
      - run: python -m unittest discover tests
