# lifegame in Rust. The line «the engine knows nothing of the screen» is drawn along crate borders:
# life-core depends on nothing graphical, and the compiler guards it.
[workspace]
resolver = "3"
members  = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
life-core = { path = "crates/life-core" }
life-sim  = { path = "crates/life-sim" }

# The tests run real simulations of thousands of ticks: without optimisations they are tens of
# times slower, so even the debug build is optimised.
[profile.dev]
opt-level = 2

[profile.release]
lto           = "thin"
codegen-units = 1
