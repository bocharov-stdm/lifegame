[package]
name        = "life-core"
description = "The lifegame engine: world, tick, neighbour grid, rules, genome. It knows nothing of the screen."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# the per-creature phases on every thread (`par.rs`); off, the engine has no threads
rayon = { version = "1", optional = true }

[features]
parallel = ["dep:rayon"]
