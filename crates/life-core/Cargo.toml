[package]
name        = "life-core"
description = "Движок lifegame: мир, тик, сетка соседей, правила, геном. Ничего не знает об экране."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# the per-creature phases on every thread (`par.rs`); off, the engine has no threads
rayon = { version = "1", optional = true }

[features]
parallel = ["dep:rayon"]
