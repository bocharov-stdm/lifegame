[package]
name        = "life-sim"
description = "Прогон lifegame без окна с жёсткими лимитами: общий движок тестов и отчёта."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
life-core.workspace = true

# holding the thread that drives the tick on the fast cores of a hybrid processor (`cores.rs`)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_SystemInformation", "Win32_System_Threading"] }
