[package]
name        = "life-app"
description = "Игра lifegame: окно, рендер мира, меню и графики. Симуляция идёт в своём потоке."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
life-core.workspace = true
life-sim.workspace  = true
eframe   = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "x11", "wayland"] }
bytemuck = { version = "1", features = ["derive"] }
clap     = { version = "4", features = ["derive"] }
directories = "6"
serde_json  = "1"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"] }

# The progress window's taskbar bar (`src/bin/life-progress.rs`); the same versions eframe pulls in.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
raw-window-handle = "0.6"
