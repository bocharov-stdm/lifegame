[package]
name        = "life-report"
description = "lifegame's windowless balance report (seeds in parallel, a summary, the reference check) and life-sweep, many reports at once."
edition.workspace = true
version.workspace = true
license.workspace = true
# `cargo run -p life-report` runs the report, not the sweep (`src/bin/life-sweep.rs`)
default-run = "life-report"

[dependencies]
life-core = { workspace = true, features = ["parallel"] }
life-sim.workspace  = true
clap       = { version = "4", features = ["derive"] }
rayon      = "1"
serde_json.workspace = true
